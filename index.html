<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FairShift</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#064E3B;--e:#047857;--ac:#34D399;--m:#ECFDF5;--bg:#F8FAFC;--w:#fff;--ink:#0F172A;--mu:#64748B;--am:#F59E0B;--co:#EF4444;--bd:#E2E8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,"Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{margin:0;line-height:1.15}h1{font-size:clamp(34px,6vw,60px);font-weight:800}h2{font-size:clamp(24px,4vw,36px);font-weight:800}h3{font-size:17px;font-weight:800}
p{margin:0}a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--e);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:46px;transition:.15s}
.btn:hover{background:#0f6b53}.btn.l{background:#fff;color:var(--g)}.btn.o{background:none;color:inherit;border:1.5px solid currentColor}.btn.s{min-height:36px;padding:6px 12px;font-size:14px}
.in{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;background:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hero{background:radial-gradient(600px 400px at 85% 10%,#1fa07c55,transparent),radial-gradient(500px 400px at 0 100%,#2bd4a122,transparent),linear-gradient(160deg,#0c2d25,var(--g) 55%,#0f5a47);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff1c 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(#000,transparent 85%)}
.nav{display:flex;align-items:center;gap:16px;padding:16px 0;position:relative}.nav .lk{display:flex;gap:20px;margin-left:24px;flex:1}.nav a{text-decoration:none;font-weight:600;font-size:15px;opacity:.9}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.hg{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;padding:48px 0 84px;position:relative;align-items:center}
.bdg{display:inline-block;background:#ffffff1f;border:1px solid #ffffff44;border-radius:99px;padding:4px 14px;font-size:13px;font-weight:700;margin-bottom:18px}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:#fff;color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 20px 40px #0004}.pc small{color:var(--mu);font-weight:600}.pc b{display:block;font-size:26px;font-weight:800}
.sec{padding:72px 0}.sec.alt{background:#fff}.sec h2{margin-bottom:12px}.lead{color:var(--mu);max-width:640px;margin-bottom:32px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 1px 2px #12392e0d}
.card:hover.fc{border-color:var(--e);transform:translateY(-2px)}.fc{transition:.15s}
.ico{width:42px;height:42px;border-radius:12px;background:var(--m);color:var(--e);display:grid;place-items:center;margin-bottom:12px}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px;background:var(--m);color:var(--e)}.tag.p{background:#fdf1dc;color:#9a6410}.tag.Open{background:#fbe3e0;color:#b4382e}.tag.Progress{background:#fdf1dc;color:#9a6410}.tag.Resolved{background:var(--m);color:var(--e)}
.cta{background:var(--g);color:#fff;text-align:center}.cta h2{margin-bottom:20px}
footer{background:#0c2d25;color:#b9cdc5;padding:40px 0;font-size:14px}footer .g4{margin-bottom:20px}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.aL{background:linear-gradient(160deg,#0c2d25,var(--g) 60%,#0f5a47);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.aR{display:grid;place-items:center;padding:28px}.aR form{width:100%;max-width:400px;display:grid;gap:12px}
label{font-weight:700;font-size:14px;display:grid;gap:4px}.err{color:#b4382e;font-size:13px;font-weight:600;min-height:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}.seg .on{border-color:var(--e);background:var(--m);color:var(--g)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sb{background:var(--g);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.sb button{display:flex;gap:10px;align-items:center;background:none;border:0;color:#cfe3db;padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;text-align:left}.sb button.on,.sb button:hover{background:#ffffff1c;color:#fff}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1px solid var(--bd)}.top .sp{flex:1}
.mn{padding:24px;display:grid;gap:18px;align-content:start;background:radial-gradient(500px 300px at 100% 0,#e8f5ef,transparent)}
.mb{display:none}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.kp b{display:block;font-size:30px;font-weight:800}.kp small{color:var(--mu);font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mu);cursor:pointer}.r{text-align:right}
.vb{display:flex;gap:10px;align-items:flex-end;height:140px;border-bottom:1px solid var(--bd)}.vb div{flex:1;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start}.vb i{display:block;background:var(--e)}.vb i.o{background:var(--am)}
.xl{display:flex;gap:10px;font-size:12px;color:var(--mu)}.xl span{flex:1;text-align:center}
.hb{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;font-size:14px;margin:6px 0}.hb i{display:block;height:12px;border-radius:6px;background:var(--e)}
.al{border-left:4px solid var(--am);background:#fdf6e9;padding:10px 12px;border-radius:8px;margin:8px 0}
.note{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 20px;border-radius:12px;z-index:9;box-shadow:0 10px 30px #0005}
@media(max-width:820px){.hg,.auth{grid-template-columns:1fr}.aL{display:none}.nav .lk{display:none}.app{grid-template-columns:1fr}.sb{position:fixed;z-index:8;left:0;width:240px;transform:translateX(-100%);transition:.2s}.sb.o{transform:none}.mb{display:inline-flex}.mn{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0f172a14}.fb{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fb label{font-size:13px;min-width:150px}.ch{position:relative;height:260px;margin-top:8px}dialog{border:0;border-radius:16px;padding:20px;max-width:560px;width:92%}dialog::backdrop{background:#0f172a66}

:root{--co:#DC2626}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--g);padding:8px 14px;border-radius:8px;font-weight:700;z-index:20}.skip:focus{left:8px}
.app>div,.mn>*{min-width:0}.card,.al,.empty{overflow-wrap:anywhere}td,th{overflow-wrap:break-word}.dt td:first-child{white-space:nowrap}.r{white-space:nowrap}
.mn{background:radial-gradient(500px 300px at 100% 0,#e8f5ef,transparent),linear-gradient(#0478570a 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,#0478570a 1px,transparent 1px) 0 0/36px 36px,var(--bg)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#ffffff0a 0 1px,transparent 1px 38px);pointer-events:none}.nav,.hg{z-index:1}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn:disabled:hover{background:var(--e)}.btn.o:disabled:hover{background:none}.btn:active{transform:translateY(1px)}.btn.big{min-height:56px;font-size:18px;flex:1 1 140px}
.sb button.on{box-shadow:inset 3px 0 0 var(--ac)}
.stt{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;font-weight:700;margin:10px 0}.stt.none{background:#F1F5F9;color:#475569}.stt.in{background:var(--m);color:var(--g);border:1.5px solid var(--ac)}.stt.out{background:var(--g);color:#fff}
.vb i.t{background:var(--ac)}.xl{margin-top:4px}
.chk{display:flex;grid-template:none;gap:8px;align-items:center;min-height:44px;font-weight:600}input[type=checkbox]{width:20px;height:20px;accent-color:var(--e);flex:none}
.fm{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:10px}
.empty{text-align:center;padding:28px 16px;color:var(--mu);border:1.5px dashed var(--bd);border-radius:16px;background:#fff}
.dt{margin-top:10px;font-size:14px}.dt summary{cursor:pointer;color:var(--e);font-weight:700}.dt .tw table{min-width:0}details.card summary{cursor:pointer}
.kp .card{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.kp small{line-height:1.3;min-height:2.6em}.kp p{margin-top:auto}
.fb label{flex:1 1 160px}.fb .fa{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}.fp{align-self:center;flex:1 1 220px}
.top select{width:auto;min-height:40px;padding:6px 8px;font-size:14px}.top .ttl{min-width:0;flex:1 1 180px}
.al b{font-weight:700;font-size:15px}.tw table{min-width:520px}.bk{display:none}
@media(max-width:820px){.bk.o{display:block;position:fixed;inset:0;background:#0f172a66;z-index:7}.toast{width:max-content;max-width:calc(100% - 32px);text-align:center}.top{padding:10px 14px}.top .sp{display:none}.fb .fa{margin-left:0;width:100%}.fb .fa .btn{flex:1}.sec{padding:48px 0}.kp b{font-size:26px}}
